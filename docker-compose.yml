services:
  postgres:
    image: postgres:16-alpine
    container_name: codexnotify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codexnotify
      POSTGRES_USER: codexnotify
      POSTGRES_PASSWORD: codexnotify
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codexnotify -d codexnotify"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
